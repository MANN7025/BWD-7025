<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Opacity Effect</title>
    <style>
        body {
            font-family: Arial, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }

        .hover-img {
            width: 500px;
            border-radius: 10px;
            opacity: 6; 
            transition: opacity 0.3s ease; 
            cursor: pointer;
        }
   
        .hover-img:hover {
            opacity: 0.01; 
        }
    </style>
</head>
<body>

    <h2>Hover over the image</h2>
    <img src="Candle.jpg" alt="Sample Image" class="hover-img">

</body>
</html>    
</body>
</html>
