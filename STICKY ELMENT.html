<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sticky Element</title>

    <style>
        /* Sticky element */
        .sticky {
            position: sticky;
            top: 0;
            background-color: blue;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
        }

        /* Page content */
        .content {
            height: 1000px;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="sticky">
        I am a Sticky Element
    </div>

    <div class="content">
        <h1>My Web Page</h1>
        <p>Scroll down to see the sticky element.</p>

        <p>
            This is some sample content. Keep scrolling and
            the blue element will stay at the top.
        </p>
    </div>

</body>
</html>
