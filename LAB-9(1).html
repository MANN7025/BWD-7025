<!DOCTYPE html>
<html>
<head>
    <title>Z-Index Example</title>

    <style>
        .box {
            width: 150px;
            height: 150px;
            position: absolute;
            color: white;
            text-align: center;
            padding-top: 20px;
            font-size: 20px;
        }

        .box1 {
            background-color: greenyellow;
            left: 100px;
            top: 100px;
            z-index: 1;
        }

        .box2 {
            background-color: rgb(212, 9, 70);
            left: 150px;
            top: 150px;
            z-index: 2;
        }

        .box3 {
            background-color:black;
            left: 200px;
            top: 200px;
            z-index: 3;
        }
    </style>
</head>

<body>

    <h1>Z-Index Example</h1>

    <div class="box box1">Box 1<br>Z-Index: 1</div>
    <div class="box box2">Box 2<br>Z-Index: 2</div>
    <div class="box box3">Box 3<br>Z-Index: 3</div>

</body>
</html>
