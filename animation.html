<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations</title>
   <center> <style>
    .container{
        width: 1000px;
        height: 500px;
        background-color: rgb(222, 135, 135);
        animation: box 10s;
    }

    @keyframes box{
        0% {background-color: violet;}
        25% {background-color: indigo;}
        50% {background-color: blue;}
        75% {background-color: green}
        100% {background-color: yellow;}
    }
</style>
</head>
<body>
<div class="container">

</div>
</body>
</html></center>
